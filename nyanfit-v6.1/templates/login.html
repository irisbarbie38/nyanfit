<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NyanFit</title><link rel="stylesheet" href="/static/css/app.css"></head>
<body class="login-page"><div class="login-card"><img src="/static/img/nyan-header.png" class="login-cat"><h1>NYANFIT</h1><p>Treino, progresso e um pouco de rainbow.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" action="/login"><input name="username" placeholder="usuário" required><input type="password" name="password" placeholder="senha" required><button>ENTRAR</button></form><details><summary>Criar conta</summary><form method="post" action="/register"><input name="username" placeholder="usuário" required><input type="password" name="password" placeholder="senha (6+)" required><button>CRIAR CONTA</button></form></details></div></body></html>
