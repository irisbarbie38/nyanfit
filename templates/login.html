<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070719">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <title>{{ "Criar conta" if register else "Entrar" }} — NyanFit</title>
</head>
<body class="auth-body">
  <main class="auth-card pixel-panel">
    <div class="nyan-mini"><img src="{{ url_for('static', filename='img/nyan-cat.svg') }}" alt="Nyan Cat"></div>
    <div class="brand">NYAN<span>FIT</span></div>
    <p class="muted">Treino de glúteos em modo pixel.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <label for="username">Usuário</label>
      <input id="username" name="username" autocomplete="username" required minlength="3">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="{{ 'new-password' if register else 'current-password' }}" required minlength="8">
      <button class="start-button big" type="submit"><span>{{ "CRIAR CONTA" if register else "ENTRAR" }}</span></button>
    </form>
    <a class="text-link" href="{{ url_for('login' if register else 'register') }}">{{ "Já tenho uma conta" if register else "Criar uma conta" }}</a>
  </main>
</body>
</html>
